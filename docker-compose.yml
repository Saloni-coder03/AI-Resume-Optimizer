services:
  backend:
    build:
      context: ./backend

    container_name: ai-resume-backend

    ports:
      - "8001:8000"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend

    container_name: ai-resume-frontend

    ports:
      - "3000:3000"

    environment:
      - REACT_APP_API_BASE_URL=http://127.0.0.1:8001
      - WATCHPACK_POLLING=true

    depends_on:
      - backend

    restart: unless-stopped